# ==============================================================================
# 📜 FILE: srcs/requirements/nginx/conf/nginx.conf
# 🎯 PURPOSE:
#    This file configures the NGINX virtual server. It defines SSL/TLS certificate
#    paths, enforces secure encryption protocols (TLSv1.2 and TLSv1.3), routes
#    WordPress PHP requests to the PHP-FPM fastcgi processor, and proxies HTTP
#    requests for Adminer (`/adminer`) and the Static Site (`/static/`).
#
# 🧒 KID-FRIENDLY CONCEPT & STORY:
#    This is Sir NGINX's Official Castle Gate Map:
#    - "If someone knocks, check that their envelope has the Royal Seal (TLSv1.2/1.3)."
#    - "If they say 'I want /static/!', point them to the art billboard room (proxy_pass)."
#    - "If they say 'I want /adminer!', point them to the librarian's desk."
#    - "If they ask for a story (a .php page), whisper down the pipe to the Baker
#      at wordpress:9000 using the secret FastCGI code!"
#
# 🎓 EVALUATION CHECKPOINT:
#    Evaluators will rigorously test:
#    1. "Is TLSv1.2 and/or TLSv1.3 enforced?"
#       Command: `openssl s_client -connect localhost:443 -tls1_2` (MUST succeed).
#       Command: `openssl s_client -connect localhost:443 -tls1_1` (MUST fail / be rejected!).
#    2. "Does NGINX communicate with WordPress over FastCGI on port 9000?"
#       Yes, configured via `fastcgi_pass wordpress:9000;`.
#    3. "Are bonus routes working?"
#       `/static/` routes to static_site:3000 and `/adminer` routes to adminer:8080.
# ==============================================================================

server {
    # 🔒 LISTEN DIRECTIVES:
    # `listen 443 ssl`: Listen for incoming IPv4 HTTPS connections on port 443.
    # `listen [::]:443 ssl`: Listen for incoming IPv6 HTTPS connections on port 443.
    # Notice: NO port 80 directive exists! Plain HTTP is completely disallowed.
    listen 443 ssl;
    listen [::]:443 ssl;

    # 🌐 SERVER NAME:
    # Replaced at container runtime by `nginx_setup.sh` with the domain from .env
    # (e.g. `zsid-ele.42.fr`) alongside `localhost`.
    server_name DOMAIN_NAME_PLACEHOLDER localhost;

    # 🛡️ TLS / SSL CERTIFICATES:
    # Public certificate and private cryptographic key paths.
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # 🔐 ENFORCED TLS PROTOCOLS:
    # Only TLSv1.2 and TLSv1.3 are permitted by the 42 subject.
    # Older, insecure protocols (SSLv2, SSLv3, TLSv1.0, TLSv1.1) are blocked!
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 📂 DOCUMENT ROOT:
    # Path where WordPress static files (images, CSS, JS) live.
    # Mounted read-only from the shared `wordpress_vol` volume!
    root /var/www/html;
    index index.php index.html index.htm;

    # --------------------------------------------------------------------------
    # 🖼️ LOCATION: /static/ (Bonus Static Website)
    # Reverse proxy passing all `/static/` traffic to the Python container on port 3000.
    # --------------------------------------------------------------------------
    location ^~ /static/ {
        proxy_pass http://static_site:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # 🔍 LOCATION: /adminer (Bonus Database GUI)
    # Reverse proxy passing `/adminer` traffic to the Adminer container on port 8080.
    # --------------------------------------------------------------------------
    location ^~ /adminer {
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # 📄 LOCATION: / (WordPress Permalinks)
    # Attempts to serve exact static files or directories requested; if not found,
    # routes the request to WordPress index.php so WordPress routing handles it.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --------------------------------------------------------------------------
    # ⚡ LOCATION: ~ \.php$ (PHP FastCGI Gateway to WordPress)
    # 🧒 CONCEPT: NGINX cannot run PHP code itself. When a visitor requests
    # a .php page, NGINX packages the request and forwards it across the network
    # to the PHP-FPM daemon waiting in the WordPress container on Port 9000!
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Forward request to container 'wordpress' on internal port 9000
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }
}
