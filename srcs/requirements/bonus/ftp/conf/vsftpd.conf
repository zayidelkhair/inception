# ==============================================================================
# 📜 FILE: srcs/requirements/bonus/ftp/conf/vsftpd.conf
# 🎯 PURPOSE:
#    This file configures the `vsftpd` FTP server daemon. It secures the server
#    by disabling anonymous access, locks logged-in users inside their home
#    directory (`chroot`), permits file uploads (`write_enable=YES`), and
#    configures passive mode port ranges for clean Docker container port mapping.
#
# 🧒 KID-FRIENDLY CONCEPT & STORY:
#    This is the Cargo Guard's Rulebook:
#    - "No strangers in masks (anonymous_enable=NO) — you must show your ID badge!"
#    - "You can put new toys in the toy box (write_enable=YES)."
#    - "You are locked inside the playroom; you cannot wander into the King's
#      bedroom (chroot_local_user=YES)!"
#    - "If delivering packages, use loading docks 21100 to 21110 (passive mode)."
#
# 🎓 EVALUATION CHECKPOINT:
#    Evaluators will ask:
#    1. "What is `chroot_local_user=YES` and why is it important?"
#       Answer: `chroot` (change root) jails the FTP user into their home
#       directory (`/var/www/html`). The user cannot navigate up (`cd ..`) to
#       view system files like `/etc/passwd` or `/root`.
#    2. "Why is `allow_writeable_chroot=YES` needed?"
#       Answer: Modern vsftpd blocks write access inside a chroot jail by default
#       as a security precaution. Since the FTP user needs to upload WordPress
#       files into `/var/www/html`, `allow_writeable_chroot=YES` permits write operations.
# ==============================================================================

# 🌐 DAEMON RUNTIME & IPV4:
# Run as standalone daemon listening on IPv4 interfaces.
listen=YES
listen_ipv6=NO

# 🚫 ACCESS CONTROL:
# anonymous_enable=NO: Disallows unauthenticated guests.
# local_enable=YES: Allows local Linux users (e.g. 'ftpuser') to log in.
# write_enable=YES: Enables uploading, renaming, and deleting files.
anonymous_enable=NO
local_enable=YES
write_enable=YES

# 🎭 FILE PERMISSIONS:
# local_umask=002: Uploaded files get 775/664 permissions so both the FTP user
# and the web server user 'www-data' can read and edit them.
local_umask=002

# 🕒 SYSTEM & LOGGING:
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# 🏰 JAIL SECURITY (CHROOT):
# Confines users strictly to their home folder (/var/www/html).
chroot_local_user=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
ssl_enable=NO

# ------------------------------------------------------------------------------
# 📦 PASSIVE MODE (PASV) FOR DOCKER NETWORKING
# In passive mode, the client initiates data connections to the server.
# We fix the port range to 21100-21110 and inject the host IP at startup.
# ------------------------------------------------------------------------------
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=PASV_ADDR_PLACEHOLDER

# ✏️ CHROOT WRITE ACCESS & SANDBOX:
# Allows write operations within the jailed directory.
allow_writeable_chroot=YES
# Disables seccomp sandbox to ensure compatibility across Docker kernels.
seccomp_sandbox=NO
