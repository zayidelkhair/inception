; ==============================================================================
; 📜 FILE: srcs/requirements/wordpress/conf/www.conf
; 🎯 PURPOSE:
;    This file configures the PHP-FPM (FastCGI Process Manager) worker pool.
;    It instructs PHP-FPM to listen for network connections on port 9000
;    (rather than a local unix socket), defines process management limits, and
;    preserves system environment variables so WordPress scripts can read them.
;
; 🧒 KID-FRIENDLY CONCEPT & STORY:
;    This is the Chef's Kitchen Work Schedule!
;    - "Who cooks the meals?" ➔ The kitchen helpers (user = www-data).
;    - "Where do orders come in?" ➔ Over the intercom at channel 9000 (listen = 9000).
;    - "How many helpers should we keep around?" (pm = dynamic)
;      Start with 5 helpers (pm.start_servers = 5). If lunch rush gets crazy,
;      hire up to 25 helpers (pm.max_children = 25)! If things get quiet, keep
;      at least 1 helper resting on the couch ready to jump up (pm.min_spare_servers = 1).
;
; 🎓 EVALUATION CHECKPOINT:
;    Evaluators will ask:
;    1. "Why `listen = 9000` instead of `/run/php/php8.2-fpm.sock`?"
;       Answer: PHP-FPM and NGINX live in DIFFERENT containers! A Unix socket
;       file only works on the SAME machine/filesystem. To communicate between
;       containers over the Docker network, PHP-FPM must listen on TCP port 9000.
;    2. "Why `clear_env = no`?"
;       Answer: By default, PHP-FPM erases environment variables for security.
;       Setting `clear_env = no` allows WordPress and WP-CLI to access the
;       variables defined in `.env` (like DOMAIN_NAME and WP_TITLE).
; ==============================================================================

[www]
; 👤 PROCESS OWNER & GROUP:
; Runs worker processes as standard unprivileged web server user 'www-data'.
user = www-data
group = www-data

; 🚪 TCP NETWORK LISTENING PORT:
; Listens on TCP port 9000 on all network interfaces so NGINX can reach it.
listen = 9000
listen.owner = www-data
listen.group = www-data

; ⚡ PROCESS MANAGEMENT (DYNAMIC):
; Workers are created dynamically based on incoming traffic demands.
pm = dynamic

; 👥 WORKER POOL LIMITS:
; Maximum number of concurrent child processes serving requests simultaneously.
pm.max_children = 25

; Number of child processes spawned immediately upon PHP-FPM startup.
pm.start_servers = 5

; Minimum number of idle worker processes kept alive waiting for new requests.
pm.min_spare_servers = 1

; Maximum number of idle worker processes kept alive during low traffic periods.
pm.max_spare_servers = 10

; 🌐 ENVIRONMENT VARIABLE RETENTION:
; Prevents PHP-FPM from wiping container environment variables.
clear_env = no
