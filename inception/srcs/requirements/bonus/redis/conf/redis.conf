# ==============================================================================
# 📜 FILE: srcs/requirements/bonus/redis/conf/redis.conf
# 🎯 PURPOSE:
#    This file configures the Redis memory cache daemon. It allows network
#    connections from other containers in the private Docker network, caps the
#    maximum memory usage to 256MB, and defines an LRU (Least Recently Used)
#    eviction policy when memory fills up.
#
# 🧒 KID-FRIENDLY CONCEPT & STORY:
#    This is the Squirrel's Sticky-Note Rules:
#    - "Accept notes from friends across the garden (protected-mode no)."
#    - "Your desk only holds 256 sticky notes (maxmemory 256mb)!"
#    - "If your desk fills up, throw away the oldest note that nobody has asked
#      for in a long time (allkeys-lru: Least Recently Used) to make room for
#      the exciting new notes!"
#
# 🎓 EVALUATION CHECKPOINT:
#    Evaluators will ask:
#    1. "What does `allkeys-lru` mean?"
#       Answer: LRU stands for "Least Recently Used". When Redis reaches its
#       memory limit (256MB), it automatically removes the oldest unaccessed
#       cached keys first, ensuring active queries always stay fast in RAM.
#    2. "Why `protected-mode no`?"
#       Answer: In Redis, protected-mode blocks connections coming from outside
#       127.0.0.1 if no password is set. Because WordPress connects across the
#       Docker bridge network IP, protected-mode must be set to 'no' to accept it.
#       This is safe because Redis is isolated inside the private Docker network!
# ==============================================================================

# 🌐 NETWORK ACCESS:
# Allows Redis to accept connections from other containers on the bridge network.
protected-mode no

# 🚪 PORT:
# Standard Redis communication port.
port 6379

# 💾 MEMORY LIMIT:
# Caps Redis RAM consumption to 256MB to prevent it from exhausting host memory.
maxmemory 256mb

# ♻️ EVICTION POLICY:
# When 256MB is reached, evicts the least recently used keys first.
maxmemory-policy allkeys-lru
